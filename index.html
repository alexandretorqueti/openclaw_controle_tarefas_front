<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Gestão de Tarefas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* Garantir que as variáveis CSS sejam definidas imediatamente */
    :root {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --bg-card: #252525;
      --bg-input: #2d2d2d;
      --bg-hover: #333333;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --text-tertiary: #888888;
      --border-color: #333333;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --warning-color: #f59e0b;
    }
    
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
    
    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
  <script>
    // Teste de variáveis CSS (apenas em desenvolvimento)
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          console.log('🔍 Verificando variáveis CSS...');
          const root = document.documentElement;
          const style = getComputedStyle(root);
          
          const variables = [
            '--bg-primary',
            '--bg-secondary',
            '--bg-card',
            '--bg-input',
            '--text-primary',
            '--text-secondary',
            '--border-color',
            '--accent-color',
            '--accent-hover',
            '--danger-color',
            '--success-color'
          ];
          
          variables.forEach(variable => {
            const value = style.getPropertyValue(variable);
            console.log(`${variable}: ${value ? '✅ ' + value.trim() : '❌ NÃO DEFINIDA'}`);
          });
        }, 1000);
      });
    }
  </script>
</body>
</html>
